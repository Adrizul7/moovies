<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Admin - Películas</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            overflow-y: auto;
        }

        .modal-content {
            background: white;
            margin: 2% auto;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            border-radius: 8px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>

<body class="admin-body">
    <header>
        <a href="admin.html" style="color:white; text-decoration:none; margin-left:20px;">← Volver al Menú Admin</a>
        <h2 style="margin:0 auto;">Gestión de Películas</h2>
    </header>

    <main class="admin-container" style="padding: 20px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>Listado de Películas</h3>
            <button class="btn-moo" onclick="abrirModal()">+ Nueva Película</button>
        </div>
        <table class="admin-table" style="width:100%; margin-top:20px; border-collapse: collapse;">
            <thead>
                <tr style="background: #003399; color:white;">
                    <th>ID</th>
                    <th>Título</th>
                    <th>Descripción</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaPelisBody"></tbody>
        </table>
    </main>

    <div id="modalPeli" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0;">Registrar Nueva Película</h3>
            <form id="formPeli">
                <div class="form-group"><label>Título</label><input type="text" id="title" required></div>
                <div class="form-group"><label>Descripción Corta</label><input type="text" id="description" required>
                </div>
                <div class="form-group"><label>Resumen</label><textarea id="summary" rows="3"></textarea></div>
                <div class="form-group"><label>URL Imagen</label><input type="text" id="image"></div>
                <div class="form-group"><label>URL Trailer</label><input type="text" id="trailer"></div>
                <div class="form-group">
                    <label>Director</label>
                    <select id="selectDirector" required>
                        <option value="">Cargando...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Actor</label>
                    <select id="selectActor" required>
                        <option value="">Cargando...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Escritor</label>
                    <select id="selectWriter" required>
                        <option value="">Cargando...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Compositor</label>
                    <select id="selectComposer" required>
                        <option value="">Cargando...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Género Principal</label>
                    <select id="selectGenre" required>
                        <option value="">Cargando...</option>
                    </select>
                </div>
                <div style="display:flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                    <button type="button" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn-moo">Guardar Película</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let editMode = false;
        let currentMovieId = null;

        // 1. CARGAR TABLA
        async function cargarTabla() {
            try {
                const response = await fetch('../api/list_movie.php');
                const movies = await response.json();
                const tbody = document.getElementById('tablaPelisBody');
                tbody.innerHTML = movies.map(m => `
                <tr>
                    <td>${m.id}</td>
                    <td>${m.title}</td>
                    <td>${m.description ? m.description.substring(0, 50) : ''}...</td>
                    <td>
                        <button onclick="abrirModal(${m.id})" style="cursor:pointer; background:none; border:none;">✏️</button>
                        <button onclick="eliminarPeli(${m.id})" style="cursor:pointer; background:none; border:none;">🗑️</button>
                    </td>
                </tr>
            `).join('');
            } catch (e) { console.error("Error al cargar tabla:", e); }
        }

        // 2. ELIMINAR
        async function eliminarPeli(id) {
            if (!confirm("¿Estás seguro de que deseas eliminar esta película?")) return;
            try {
                const res = await fetch(`../api/delete_movie.php?id=${id}`, { method: 'DELETE' });
                const result = await res.json();
                if (result.success) {
                    alert("Película eliminada correctamente");
                    cargarTabla();
                } else {
                    alert("Error al eliminar: " + (result.error || "Fallo desconocido"));
                }
            } catch (e) {
                alert("No se pudo conectar con el servidor para eliminar.");
            }
        }

    async function cargarAuxiliares() {
    try {
        const [resDir, resAct, resWri, resCom, resG] = await Promise.all([
            fetch('../api/list_people.php?role_id=2'),
            fetch('../api/list_people.php?role_id=1'),
            fetch('../api/list_people.php?role_id=3'),
            fetch('../api/list_people.php?role_id=4'),
            fetch('../api/list_genres.php')
        ]);

        const directors = await resDir.json();
        const actors    = await resAct.json();
        const writers   = await resWri.json();
        const composers = await resCom.json();
        const genres    = await resG.json();

        const makeOptions = (label, list) =>
            `<option value="">Selecciona ${label}</option>` +
            list.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

        document.getElementById('selectDirector').innerHTML  = makeOptions('director', directors);
        document.getElementById('selectActor').innerHTML     = makeOptions('actor', actors);
        document.getElementById('selectWriter').innerHTML    = makeOptions('escritor', writers);
        document.getElementById('selectComposer').innerHTML  = makeOptions('compositor', composers);
        document.getElementById('selectGenre').innerHTML     =
            '<option value="">Selecciona género</option>' +
            genres.map(g => `<option value="${g.id}">${g.type}</option>`).join('');

    } catch (e) { console.error("Error en auxiliares:", e); }
}

        // 4. ABRIR MODAL
        async function abrirModal(id = null) {
            await cargarAuxiliares();
            const modal = document.getElementById('modalPeli');
            modal.style.display = 'block';

            if (id) {
                editMode = true;
                currentMovieId = id;
                modal.querySelector('h3').innerText = "Editar Película";
                const res = await fetch(`../api/get_movie_details.php?id=${id}`);
                const m = await res.json();

                document.getElementById('title').value = m.title || '';
                document.getElementById('description').value = m.description || '';
                document.getElementById('summary').value = m.summary || '';
                document.getElementById('image').value = m.image || '';
                document.getElementById('trailer').value = m.trailer || '';
                document.getElementById('selectDirector').value = m.director_id || '';
                document.getElementById('selectActor').value = m.actor_id || '';
                document.getElementById('selectWriter').value = m.writer_id || '';
                document.getElementById('selectComposer').value = m.composer_id || '';
                document.getElementById('selectGenre').value = m.genre_id || '';
            } else {
                editMode = false;
                currentMovieId = null;
                modal.querySelector('h3').innerText = "Registrar Nueva Película";
                document.getElementById('formPeli').reset();
            }
        }

        function cerrarModal() {
            document.getElementById('modalPeli').style.display = 'none';
        }

        // 5. GUARDAR / ACTUALIZAR
        document.getElementById('formPeli').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                id: currentMovieId,
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                summary: document.getElementById('summary').value,
                image: document.getElementById('image').value,
                trailer: document.getElementById('trailer').value,
                director_id: document.getElementById('selectDirector').value,
                actor_id: document.getElementById('selectActor').value,
                writer_id: document.getElementById('selectWriter').value,
                composer_id: document.getElementById('selectComposer').value,
                genre_id: document.getElementById('selectGenre').value
            };

            const url = editMode ? '../api/update_movie.php' : '../api/save_movie_full.php';

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();

                if (result.success) {
                    alert(result.message || "¡Película guardada!");
                    cerrarModal();
                    cargarTabla();
                } else {
                    alert("Error: " + (result.error || "No se pudo guardar"));
                }
            } catch (e) {
                console.error("Error en guardar:", e);
                alert("No se pudo conectar con el servidor.");
            }
        };

        window.onload = cargarTabla;
    </script>
</body>

</html>
